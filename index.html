<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Texas Hold'em Poker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <div class="title-bar">♠ TEXAS HOLD'EM ♥</div>

  <!-- ══ LOBBY SCREEN ══════════════════════════════════════ -->
  <div id="lobbyScreen" class="screen">

    <div class="lobby-mode-tabs">
      <button class="tab-btn active" data-tab="solo" onclick="switchTab('solo')">🤖 Gegen Bots</button>
      <button class="tab-btn" data-tab="multi" onclick="switchTab('multi')">🌐 Multiplayer</button>
    </div>

    <!-- Solo Tab -->
    <div id="tabSolo" class="tab-panel active">
      <div class="settings-bar">
        <label for="numBots">Bots:</label>
        <select id="numBots">
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
        <label for="botStrength">Bot-Stärke:</label>
        <select id="botStrength">
          <option value="weak">Anfänger</option>
          <option value="medium" selected>Mittel</option>
          <option value="strong">Stark</option>
          <option value="expert">Experte</option>
        </select>
        <label for="blindsLevel">Blinds:</label>
        <select id="blindsLevel">
          <option value="low">10 / 20</option>
          <option value="med" selected>25 / 50</option>
          <option value="high">50 / 100</option>
          <option value="turbo">100 / 200</option>
        </select>
      </div>
      <div style="text-align:center; margin-top:14px;">
        <button class="btn btn-deal" onclick="startSoloGame()">🃏 Spiel starten</button>
      </div>
    </div>

    <!-- Multiplayer Tab -->
    <div id="tabMulti" class="tab-panel" style="display:none">
      <div class="multi-name-row">
        <label for="playerName">Dein Name:</label>
        <input id="playerName" type="text" maxlength="12" placeholder="Spielername" value="Spieler" class="name-input" />
      </div>

      <div class="multi-cols">
        <!-- Create Room -->
        <div class="multi-card">
          <div class="multi-card-title">Raum erstellen</div>
          <div class="multi-card-sub">Du bist Host & Dealer-Logik läuft bei dir</div>
          <div class="settings-bar" style="margin:10px 0; border-radius:8px;">
            <label for="mBlindLevel">Blinds:</label>
            <select id="mBlindLevel">
              <option value="low">10 / 20</option>
              <option value="med" selected>25 / 50</option>
              <option value="high">50 / 100</option>
              <option value="turbo">100 / 200</option>
            </select>
            <label for="mBots">Bots:</label>
            <select id="mBots">
              <option value="0" selected>0</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
            </select>
          </div>
          <button class="btn btn-call" style="width:100%" onclick="createRoom()">Raum erstellen</button>
          <div id="roomCodeDisplay" class="room-code-display" style="display:none">
            <div class="room-code-label">Raum-Code</div>
            <div class="room-code-value" id="roomCodeValue">––</div>
            <div class="room-code-hint">Teile diesen Code mit deinen Mitspielern</div>
            <div id="waitingPlayers" class="waiting-players"></div>
            <button class="btn btn-deal" id="startMultiBtn" onclick="startMultiGame()" disabled>Spiel starten</button>
          </div>
        </div>

        <!-- Join Room -->
        <div class="multi-card">
          <div class="multi-card-title">Raum beitreten</div>
          <div class="multi-card-sub">Gib den Code des Hosts ein</div>
          <input id="joinCodeInput" type="text" maxlength="6" placeholder="Code eingeben…" class="name-input" style="text-transform:uppercase; font-size:18px; text-align:center; letter-spacing:4px; width:100%; margin:12px 0;" oninput="this.value=this.value.toUpperCase()" />
          <button class="btn btn-raise" style="width:100%" onclick="joinRoom()">Beitreten</button>
          <div id="joinStatus" class="join-status"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ GAME SCREEN ═══════════════════════════════════════ -->
  <div id="gameScreen" class="screen" style="display:none">

    <div class="game-topbar">
      <button class="btn-back" onclick="backToLobby()">← Lobby</button>
      <span class="game-mode-badge" id="gameModeBadge">Solo</span>
      <span class="net-status" id="netStatus"></span>
    </div>

    <!-- Poker Table -->
    <div class="table-wrap">
      <div class="table-felt"></div>
      <div class="table-content">
        <div class="bot-row" id="botRow"></div>
        <div class="community-area">
          <div class="phase-label" id="phaseLabel">Warte auf Start…</div>
          <div class="community-cards" id="communityCards"></div>
          <div class="pot-display" id="potDisplay">Pot: 0</div>
        </div>
        <div class="player-area" id="playerArea">
          <div class="idle-msg">Bereit zum Spielen</div>
        </div>
      </div>
      <div id="messageOverlay" class="message-overlay" style="display:none;"></div>
    </div>

    <div class="log-area" id="logArea"></div>
  </div>

</div>

<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="app.js"></script>
</body>
</html>
